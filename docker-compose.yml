# FormBase — self-hosted form backend.
#
#   docker compose up -d
#
# That is the whole setup. No configuration is required: a signing secret is
# generated on first run and persisted in the data volume. Then open
# http://localhost:3000 and create an account.
#
# To change anything below, either edit this file or drop a .env alongside it
# (see .env.example) — Compose reads .env automatically.

services:
  formbase:
    build: .
    image: formbase:latest
    container_name: formbase
    restart: unless-stopped

    ports:
      # host:container — change only the left side, via FORMBASE_PORT in .env.
      # The container always listens on 3000 (PORT and DATA_DIR are fixed in
      # the Dockerfile and intentionally not overridable).
      - "${FORMBASE_PORT:-3000}:3000"

    # Every value below is optional and passed through from .env, so you never
    # need to edit this file — set what you want in .env and leave the rest.
    # An unset variable arrives as an empty string, which the app treats
    # exactly as "not configured".
    #
    # This list is kept in step with .env.example, which documents the default
    # for each one. Adding a variable in one file means adding it to the other.
    environment:
      # --- Registration -----------------------------------------------------
      # Set to 1 to close public sign-up: /api/auth/register returns 403 for
      # everyone and the dashboard hides the sign-up form. Existing accounts
      # keep working, and admins can still create accounts from the Users page.
      DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-}"

      # --- First admin ------------------------------------------------------
      # The first account created is automatically an admin, so normally you
      # leave these unset and just sign up. Set both only when bringing up an
      # instance with DISABLE_REGISTRATION already on, where there would
      # otherwise be no way to create that first account. Applied only when the
      # database has no users; ignored entirely once one exists.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

      # --- Signing secret ---------------------------------------------------
      # Unset: a random secret is generated into the data volume on first run
      # and reused across restarts. Set it explicitly if you run more than one
      # replica, or they will issue tokens the others reject. Minimum 32 chars:
      #   openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:-}"
      # How long a login stays valid. Default 7d.
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-}"

      # --- Behind a reverse proxy -------------------------------------------
      # Set to 1 if Traefik/nginx/Caddy sits in front, otherwise every request
      # looks like it came from the proxy and rate limiting throttles all users
      # as one. Leave unset when publishing the port directly — enabling it
      # without a proxy lets anyone spoof X-Forwarded-For and evade the limits.
      TRUST_PROXY: "${TRUST_PROXY:-}"

      # --- HTTPS -------------------------------------------------------------
      # Set to 1 ONLY when FormBase is actually reachable over https. It turns
      # on HSTS and the CSP's upgrade-insecure-requests directive.
      # Turning it on without TLS makes the dashboard render BLANK on any
      # address other than localhost, because the browser tries to fetch
      # /app.js over https and nothing answers.
      FORCE_HTTPS: "${FORCE_HTTPS:-}"

      # --- Dashboard origin --------------------------------------------------
      # Only needed if the dashboard is served from a different origin than the
      # API. The normal same-origin setup needs nothing.
      CORS_ORIGIN: "${CORS_ORIGIN:-}"

      # --- Webhooks ----------------------------------------------------------
      # Webhooks to private/LAN addresses are blocked by default to prevent
      # server-side request forgery. Set to 1 only if you genuinely need to POST
      # to something on your own network.
      SSRF_ALLOW_PRIVATE: "${SSRF_ALLOW_PRIVATE:-}"

      # --- Rate limits --------------------------------------------------------
      # Defaults (10 / 5 / 30 / 300) suit a public instance. Raise them if your
      # users share one source IP — office NAT, VPN, CGNAT.
      RATE_LIMIT_AUTH_IP: "${RATE_LIMIT_AUTH_IP:-}"           # per IP / 15 min
      RATE_LIMIT_AUTH_ACCOUNT: "${RATE_LIMIT_AUTH_ACCOUNT:-}" # per account / 15 min
      RATE_LIMIT_SUBMIT: "${RATE_LIMIT_SUBMIT:-}"             # per IP / form / min
      RATE_LIMIT_API: "${RATE_LIMIT_API:-}"                   # per IP / min

      # --- Email notifications -------------------------------------------------
      # Without SMTP_HOST, notifications are logged rather than sent.
      #
      # SMTP_FROM must be an address your relay is allowed to send as — normally
      # one on your own domain, usually the same as SMTP_USER. A From on a
      # domain the relay does not own is rejected with
      # "553 Sender is not allowed to relay emails" and the alert is lost.
      #
      # The config is verified at startup: `docker compose logs formbase | grep
      # mail` shows either "[mail] ready: ..." or exactly what to change.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"       # default 587
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"       # falls back to SMTP_USER if it is an address
      SMTP_SECURE: "${SMTP_SECURE:-}"   # inferred from the port; 465 = implicit TLS

    volumes:
      # A NAMED volume, deliberately. The container runs as non-root (uid
      # 1000) and a named volume inherits that ownership automatically. A bind
      # mount does not — if you switch to one, chown the host directory to
      # 1000:1000 first or the database will fail to open.
      - formbase-data:/app/data

    healthcheck:
      # Uses node rather than curl/wget so it does not depend on anything
      # extra being present in the image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Modest hardening. The app needs no elevated capabilities and never
    # writes outside /app/data.
    security_opt:
      - no-new-privileges:true

volumes:
  formbase-data:
