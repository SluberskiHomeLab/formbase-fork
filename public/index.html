<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormBase — Open Source Form Backend</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#141414;--border:#262626;--text:#e5e5e5;--muted:#737373;--accent:#3b82f6;--accent-hover:#2563eb;--danger:#ef4444;--success:#22c55e;--radius:8px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font:inherit}
input,textarea,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.container{max-width:1000px;margin:0 auto;padding:20px}
/* NOTE: the dashboard script lives in app.js, not inline, so the app can ship
   a strict `script-src 'self'` Content-Security-Policy. Keep it that way. */

/* Nav */
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
nav .logo{font-size:1.3em;font-weight:700;color:var(--text)}
nav .logo span{color:var(--accent)}
nav .nav-actions{display:flex;gap:12px;align-items:center}
nav .user-email{color:var(--muted);font-size:.85em}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:none;font-weight:500;font-size:.9em;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.8}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:.8em}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{margin-bottom:8px}
.card .meta{color:var(--muted);font-size:.85em}

/* Grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat .num{font-size:2em;font-weight:700;color:var(--accent)}
.stat .label{color:var(--muted);font-size:.85em}

/* Form fields */
.field{margin-bottom:16px}
.field label{display:block;font-size:.85em;color:var(--muted);margin-bottom:4px}

/* Table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:.8em;text-transform:uppercase;font-weight:600}
td{font-size:.9em}
tr:hover td{background:rgba(59,130,246,.03)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h2{margin-bottom:16px}

/* Hero */
.hero{text-align:center;padding:80px 20px}
.hero h1{font-size:3em;margin-bottom:16px;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:1.2em;max-width:600px;margin:0 auto 32px}
.hero .actions{display:flex;gap:12px;justify-content:center}

/* Features */
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:0 20px 60px;max-width:1000px;margin:0 auto}
.feature{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.feature h3{margin-bottom:8px}
.feature p{color:var(--muted);font-size:.9em}

/* Code block */
.code{background:#1a1a2e;border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'Fira Code',monospace;font-size:.85em;overflow-x:auto;margin:16px 0;color:#93c5fd;white-space:pre}

/* Auth page */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:80vh}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:360px}
.auth-box h2{text-align:center;margin-bottom:24px}
.auth-toggle{text-align:center;margin-top:16px;color:var(--muted);font-size:.9em}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;z-index:200;animation:slideIn .3s ease}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.empty{text-align:center;padding:40px;color:var(--muted)}

/* Badges — role and account status in the user table */
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:.75em;font-weight:600;border:1px solid var(--border);color:var(--muted);vertical-align:middle}
.badge-admin{border-color:var(--accent);color:var(--accent)}
.badge-ok{border-color:var(--success);color:var(--success)}
.badge-off{border-color:var(--danger);color:var(--danger)}
code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.9em}
select{cursor:pointer}
select:disabled,input:disabled{opacity:.5;cursor:not-allowed}

/* Copy button */
.copy-wrap{position:relative}
.copy-wrap .copy-btn{position:absolute;top:8px;right:8px;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 8px;font-size:.75em;cursor:pointer}
.copy-wrap .copy-btn:hover{background:var(--accent)}

/* Responsive */
@media(max-width:600px){.hero h1{font-size:2em}.features{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
